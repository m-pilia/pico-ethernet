name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bazelisk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/bazelisk" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "$HOME/.local/bin/bazelisk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # /mnt has more available space
      - name: Redirect Bazel to /mnt
        run: |
          sudo mkdir -p /mnt/bazel /mnt/bazel-repo-cache
          sudo chown -R "$(id -un):$(id -gn)" /mnt/bazel /mnt/bazel-repo-cache
          cat > "$HOME/.bazelrc" <<'EOF'
          startup --output_user_root=/mnt/bazel
          common --repository_cache=/mnt/bazel-repo-cache
          EOF

      - name: Host tests
        run: bazelisk test //...

      - name: Host tests (ASan)
        run: bazelisk test --config=asan //...

      - name: Host tests (UBSan)
        run: bazelisk test --config=ubsan //...

      - name: Host tests (MSan)
        run: bazelisk test --config=msan //...

      - name: Firmware build
        run: bazelisk build --config=rp2350 //src:pico_ethernet_firmware

      - name: Binary-size gate
        run: bazelisk build --config=rp2350 //tools/checks:binary_size_gate

      - name: No-dynamic-allocation gate
        run: bazelisk build --config=rp2350 //tools/checks:no_alloc_gate

      - name: clang-format
        run: bazelisk run //tools/format:check

      - name: clang-tidy
        run: ./tools/tidy/check.sh
